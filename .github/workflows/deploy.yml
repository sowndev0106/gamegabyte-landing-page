name: Deploy GameGabyte web

# Mirrors the manual scripts (deploy.main.sh / deploy.uat.sh):
#   uat  -> production branch of the Pages project (uat.gamegabyte.com)
#   main -> preview deployment only (main.gamegabyte-web.pages.dev)
# Any other branch pushed here lands on its own preview URL.

on:
  push:
    branches:
      - main
      - uat
      - rebuild-gamegabyte
  workflow_dispatch:

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=gamegabyte-web --branch=${{ github.ref_name }}
